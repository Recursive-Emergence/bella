<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg"
     font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c39bd3"/>
    </marker>
  </defs>

  <rect width="1000" height="470" fill="#0d1117"/>

  <text x="40" y="40" font-size="21" font-weight="600" fill="#e6edf3" letter-spacing="-0.01em">
    Self-certifying identity — the shebang that points at itself
  </text>
  <text x="40" y="62" font-size="13" fill="#8b949e">
    The ID is a function of the very content it names — like a shebang naming the interpreter of the file it heads. No external issuer.
  </text>

  <line x1="520" y1="92" x2="520" y2="404" stroke="#30363d" stroke-width="1"/>

  <!-- ── strange loop ── -->
  <text x="40" y="112" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="0.12em">THE STRANGE LOOP</text>

  <rect x="150" y="138" width="180" height="56" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="240" y="162" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">content</text>
  <text x="240" y="180" font-size="10.5" fill="#8b949e" text-anchor="middle">the journal · the gene</text>

  <rect x="350" y="232" width="120" height="50" rx="6" fill="#1c1726" stroke="#c39bd3" stroke-width="1.3"/>
  <text x="410" y="262" font-size="13" font-weight="600" fill="#c39bd3" text-anchor="middle">hash( · )</text>

  <rect x="150" y="320" width="180" height="56" rx="6" fill="#16241c" stroke="#62d196" stroke-width="1.3"/>
  <text x="240" y="344" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">ID</text>
  <text x="240" y="362" font-size="10.5" fill="#62d196" text-anchor="middle">self-certifying identifier</text>

  <path d="M330 172 Q 420 188 412 230" stroke="#c39bd3" stroke-width="1.6" fill="none" marker-end="url(#p)"/>
  <path d="M408 282 Q 418 322 332 344" stroke="#c39bd3" stroke-width="1.6" fill="none" marker-end="url(#p)"/>
  <path d="M150 344 Q 70 258 150 172" stroke="#c39bd3" stroke-width="1.6" fill="none" marker-end="url(#p)"/>
  <text x="60" y="240" font-size="11" fill="#c39bd3" transform="rotate(-90 60 240)" text-anchor="middle">certifies · names</text>

  <text x="240" y="406" font-size="12" fill="#8b949e" text-anchor="middle">no external issuer — the entity authenticates itself (§6.4–6.5)</text>

  <!-- ── shebang analogy ── -->
  <text x="552" y="112" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="0.12em">THE SHEBANG ANALOGY</text>

  <rect x="552" y="126" width="408" height="186" rx="8" fill="#0b0e13" stroke="#30363d" stroke-width="1"/>
  <g font-family="ui-monospace, monospace" font-size="12.5">
    <text x="572" y="154" fill="#c39bd3">#!/usr/bin/bella</text>
    <text x="740" y="154" fill="#6e7681" font-family="ui-sans-serif,sans-serif" font-size="10.5">← names its own interpreter</text>
    <text x="572" y="180" fill="#c9d1d9">⊢ B1 "I build beliefs from evidence"</text>
    <text x="572" y="202" fill="#c9d1d9">⊢ B2 "⊥ is for genuine dispute only"</text>
    <text x="572" y="224" fill="#6e7681">⊢ …</text>
    <line x1="572" y1="240" x2="940" y2="240" stroke="#30363d" stroke-width="0.8"/>
    <text x="572" y="266" fill="#62d196">id = blake3(⟨this whole file⟩)</text>
    <text x="572" y="292" fill="#6e7681" font-family="ui-sans-serif,sans-serif" font-size="10.5">change one byte → change the id; the id cannot lie about its content</text>
  </g>
  <text x="540" y="340" font-size="11.5" fill="#c9d1d9">The gene is read by the kernel it describes — soft homoiconicity (§6.5).</text>

  <!-- tie-in -->
  <rect x="40" y="410" width="920" height="50" rx="6" fill="#0f1419" stroke="#1f262e" stroke-width="0.8"/>
  <text x="58" y="431" font-size="12.5" fill="#e6edf3">A fork needs <tspan font-weight="600">no authority</tspan> to mint a child ID — each descendant self-certifies from its own content (§2).</text>
  <text x="58" y="450" font-size="12" fill="#8b949e">Self-reference is the mechanism — cf. Gödel; Hofstadter's strange loop.</text>
</svg>
