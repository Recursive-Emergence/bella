<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg"
     font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <marker id="g2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#62d196"/>
    </marker>
    <marker id="gr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/>
    </marker>
  </defs>

  <rect width="1000" height="430" fill="#0d1117"/>

  <text x="40" y="40" font-size="21" font-weight="600" fill="#e6edf3" letter-spacing="-0.01em">
    Fission and fusion — fork and merge
  </text>
  <text x="40" y="62" font-size="13" fill="#8b949e">
    A fork is a birth. A merge must not double-count the shared past.
  </text>

  <line x1="500" y1="92" x2="500" y2="346" stroke="#30363d" stroke-width="1"/>

  <!-- ── FISSION ── -->
  <text x="40" y="112" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="0.12em">FISSION · FORK — A BIRTH</text>

  <g transform="translate(48,196)"><rect width="46" height="42" rx="6" fill="#161b22" stroke="#30363d"/><text x="23" y="26" font-size="11" fill="#8b949e" text-anchor="middle">…</text></g>
  <g transform="translate(150,196)"><rect width="74" height="42" rx="6" fill="#1c1726" stroke="#c39bd3" stroke-width="1.2"/><text x="37" y="20" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="middle">A</text><text x="37" y="35" font-size="9" font-family="ui-monospace,monospace" fill="#c39bd3" text-anchor="middle">@copy</text></g>

  <g transform="translate(310,150)"><rect width="74" height="42" rx="6" fill="#16241c" stroke="#62d196" stroke-width="1.4"/><text x="37" y="20" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="middle">A1</text><text x="37" y="35" font-size="9" font-family="ui-monospace,monospace" fill="#62d196" text-anchor="middle">leaf</text></g>
  <g transform="translate(310,244)"><rect width="74" height="42" rx="6" fill="#16241c" stroke="#62d196" stroke-width="1.4"/><text x="37" y="20" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="middle">A2</text><text x="37" y="35" font-size="9" font-family="ui-monospace,monospace" fill="#62d196" text-anchor="middle">leaf</text></g>

  <path d="M94 217 L150 217" stroke="#6e7681" stroke-width="1.2" marker-end="url(#gr2)"/>
  <path d="M224 210 Q 270 188 310 174" stroke="#62d196" stroke-width="1.4" fill="none" marker-end="url(#g2)"/>
  <path d="M224 224 Q 270 246 310 264" stroke="#62d196" stroke-width="1.4" fill="none" marker-end="url(#g2)"/>

  <text x="40" y="324" font-size="12" fill="#c9d1d9">both A1, A2 are R-continuous with A (shared prefix);</text>
  <text x="40" y="342" font-size="12" fill="#c9d1d9">neither <tspan font-style="italic">is</tspan> A (transitivity) · authority is <tspan fill="#fb7185">not</tspan> inherited (§5).</text>

  <!-- ── FUSION ── -->
  <text x="520" y="112" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="0.12em">FUSION · MERGE — DEDUP THE SHARED PAST</text>

  <!-- A1 = P | X1 -->
  <g transform="translate(540,150)">
    <rect width="150" height="42" rx="6" fill="#161b22" stroke="#30363d"/>
    <rect width="74" height="42" rx="6" fill="#1c1726" stroke="#c39bd3" stroke-width="1"/>
    <text x="37"  y="26" font-size="11" font-weight="600" fill="#c39bd3" text-anchor="middle">P</text>
    <text x="112" y="26" font-size="11" font-weight="600" fill="#e6edf3" text-anchor="middle">X1</text>
  </g>
  <text x="700" y="176" font-size="11" fill="#8b949e">A1</text>

  <!-- A2 = P | X2 -->
  <g transform="translate(540,244)">
    <rect width="150" height="42" rx="6" fill="#161b22" stroke="#30363d"/>
    <rect width="74" height="42" rx="6" fill="#1c1726" stroke="#c39bd3" stroke-width="1"/>
    <text x="37"  y="26" font-size="11" font-weight="600" fill="#c39bd3" text-anchor="middle">P</text>
    <text x="112" y="26" font-size="11" font-weight="600" fill="#e6edf3" text-anchor="middle">X2</text>
  </g>
  <text x="700" y="270" font-size="11" fill="#8b949e">A2</text>

  <!-- A' = P | X1 | X2 -->
  <g transform="translate(800,194)">
    <rect width="156" height="48" rx="6" fill="#161b22" stroke="#62d196" stroke-width="1.4"/>
    <rect width="56" height="48" rx="6" fill="#1c1726" stroke="#c39bd3" stroke-width="1"/>
    <text x="28"  y="29" font-size="11" font-weight="600" fill="#c39bd3" text-anchor="middle">P</text>
    <text x="83"  y="29" font-size="11" font-weight="600" fill="#e6edf3" text-anchor="middle">X1</text>
    <text x="128" y="29" font-size="11" font-weight="600" fill="#e6edf3" text-anchor="middle">X2</text>
  </g>
  <text x="878" y="184" font-size="11" fill="#62d196">A′ · P once</text>

  <path d="M690 174 Q 750 188 800 206" stroke="#62d196" stroke-width="1.4" fill="none" marker-end="url(#g2)"/>
  <path d="M690 262 Q 750 246 800 230" stroke="#62d196" stroke-width="1.4" fill="none" marker-end="url(#g2)"/>

  <text x="520" y="324" font-size="12" fill="#fb7185">✗ naïve union counts P twice — its beliefs look doubly-confirmed.</text>
  <text x="510" y="342" font-size="12" fill="#62d196">✓ fusion dedups P via the common-ancestor hash = cross-source dep. (T4).</text>

  <rect x="40" y="368" width="916" height="34" rx="6" fill="#0f1419" stroke="#1f262e" stroke-width="0.8"/>
  <text x="58" y="390" font-size="12" fill="#8b949e">
    Where X1 and X2 contradict, the conflict is kept as a ⊥ dispute and settled by the evidence calculus — not silently merged.
  </text>
</svg>
