<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg"
     font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#62d196"/>
    </marker>
    <marker id="gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/>
    </marker>
  </defs>

  <rect width="1000" height="470" fill="#0d1117"/>

  <text x="40" y="40" font-size="21" font-weight="600" fill="#e6edf3" letter-spacing="-0.01em">
    Three identity levels — block, branch, clade
  </text>
  <text x="40" y="62" font-size="13" fill="#8b949e">
    Fluid at the leaf, rigid in the lineage. A live/snapshot dual-URI, plus the ancestor level.
  </text>

  <!-- clade zone -->
  <rect x="56" y="180" width="322" height="64" rx="8" fill="#1c1726" stroke="#c39bd3" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="64" y="174" font-size="11" font-weight="600" fill="#c39bd3" letter-spacing="0.08em">CLADE · shared ancestor · kinship witness</text>

  <!-- shared-ancestor chain -->
  <g transform="translate(70,190)"><rect width="60" height="44" rx="6" fill="#161b22" stroke="#30363d"/><text x="30" y="20" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">b₀</text><text x="30" y="36" font-size="9" font-family="ui-monospace,monospace" fill="#6e7681" text-anchor="middle">9f3a</text></g>
  <g transform="translate(190,190)"><rect width="60" height="44" rx="6" fill="#161b22" stroke="#30363d"/><text x="30" y="20" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">b₁</text><text x="30" y="36" font-size="9" font-family="ui-monospace,monospace" fill="#6e7681" text-anchor="middle">c7d1</text></g>
  <g transform="translate(310,190)"><rect width="60" height="44" rx="6" fill="#161b22" stroke="#30363d"/><text x="30" y="20" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">b₂</text><text x="30" y="36" font-size="9" font-family="ui-monospace,monospace" fill="#6e7681" text-anchor="middle">fork</text></g>

  <!-- upper branch A1 -->
  <g transform="translate(440,140)"><rect width="60" height="44" rx="6" fill="#161b22" stroke="#30363d"/><text x="30" y="20" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">a₃</text></g>
  <g transform="translate(560,140)"><rect width="60" height="44" rx="6" fill="#16241c" stroke="#62d196" stroke-width="1.4"/><text x="30" y="20" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">a₄</text><text x="30" y="36" font-size="9" font-family="ui-monospace,monospace" fill="#62d196" text-anchor="middle">leaf</text></g>
  <text x="636" y="166" font-size="12" fill="#62d196">◂ branch A1 (pointer)</text>

  <!-- lower branch A2 -->
  <g transform="translate(440,240)"><rect width="60" height="44" rx="6" fill="#161b22" stroke="#30363d"/><text x="30" y="20" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">c₃</text></g>
  <g transform="translate(560,240)"><rect width="60" height="44" rx="6" fill="#16241c" stroke="#62d196" stroke-width="1.4"/><text x="30" y="20" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">c₄</text><text x="30" y="36" font-size="9" font-family="ui-monospace,monospace" fill="#62d196" text-anchor="middle">leaf</text></g>
  <text x="636" y="266" font-size="12" fill="#62d196">◂ branch A2 (pointer)</text>

  <!-- edges -->
  <path d="M130 212 L190 212" stroke="#6e7681" stroke-width="1.2" marker-end="url(#gr)"/>
  <path d="M250 212 L310 212" stroke="#6e7681" stroke-width="1.2" marker-end="url(#gr)"/>
  <path d="M370 204 Q 410 184 440 166" stroke="#62d196" stroke-width="1.4" fill="none" marker-end="url(#g)"/>
  <path d="M370 220 Q 410 244 440 262" stroke="#62d196" stroke-width="1.4" fill="none" marker-end="url(#g)"/>
  <path d="M500 162 L560 162" stroke="#62d196" stroke-width="1.4" marker-end="url(#g)"/>
  <path d="M500 262 L560 262" stroke="#62d196" stroke-width="1.4" marker-end="url(#g)"/>

  <text x="340" y="300" font-size="10.5" fill="#8b949e" text-anchor="middle">branch A forks here</text>

  <!-- legend table -->
  <g transform="translate(40,336)">
    <rect x="0" y="0" width="920" height="116" rx="6" fill="#0f1419" stroke="#1f262e" stroke-width="0.8"/>
    <circle cx="22" cy="28" r="5" fill="#62d196"/>
    <text x="40" y="32" font-size="13" font-weight="600" fill="#e6edf3">block (leaf)</text>
    <text x="190" y="32" font-size="12.5" fill="#c9d1d9">this exact mind-state; changes every thought (every state mutation)</text>
    <text x="720" y="32" font-size="11.5" font-family="ui-monospace,monospace" fill="#8b949e">snapshot URI</text>

    <circle cx="22" cy="60" r="5" fill="#58a6ff"/>
    <text x="40" y="64" font-size="13" font-weight="600" fill="#e6edf3">branch</text>
    <text x="190" y="64" font-size="12.5" fill="#c9d1d9">the continuant; a movable pointer that advances as the chain grows</text>
    <text x="720" y="64" font-size="11.5" font-family="ui-monospace,monospace" fill="#8b949e">live URI (did:web)</text>

    <circle cx="22" cy="92" r="5" fill="#c39bd3"/>
    <text x="40" y="96" font-size="13" font-weight="600" fill="#e6edf3">clade</text>
    <text x="190" y="96" font-size="12.5" fill="#c9d1d9">shared ancestor; the "A-ness" common to all descendants — kinship</text>
    <text x="720" y="96" font-size="11.5" font-family="ui-monospace,monospace" fill="#8b949e">new — the fission level</text>
  </g>
</svg>
