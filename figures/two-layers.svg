<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg"
     font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <marker id="g3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#62d196"/>
    </marker>
    <marker id="b3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="1000" height="500" fill="#0d1117"/>

  <text x="40" y="40" font-size="21" font-weight="600" fill="#e6edf3" letter-spacing="-0.01em">
    Two layers — continuity and authority
  </text>
  <text x="40" y="62" font-size="13" fill="#8b949e">
    Who is kin (Parfit) vs. who may act as whom (speaks-for). Joined by one downward reference.
  </text>

  <!-- AUTHORITY band -->
  <text x="40" y="106" font-size="11" font-weight="600" fill="#d29922" letter-spacing="0.1em">AUTHORITY / ACCOUNTABILITY — who may act as whom · fork-HOSTILE (gated)</text>
  <rect x="40" y="116" width="920" height="118" rx="8" fill="#161310" stroke="#3a2f1a" stroke-width="1"/>

  <rect x="66" y="146" width="190" height="62" rx="6" fill="#1d1a12" stroke="#d29922" stroke-width="1.2"/>
  <text x="80" y="170" font-size="12.5" font-weight="600" fill="#e6edf3">decision record</text>
  <text x="80" y="190" font-size="11.5" fill="#d29922">“may this branch act as X?”</text>

  <g font-size="12.5" fill="#c9d1d9">
    <text x="300" y="160">• <tspan fill="#e6edf3" font-weight="600">A ⇒ B</tspan>  “speaks for” — Abadi, Lampson et al., 1993</text>
    <text x="300" y="186">• authority = an unforgeable <tspan fill="#e6edf3">capability</tspan> — Miller, 2006</text>
    <text x="300" y="212">• <tspan font-family="ui-monospace,monospace" fill="#e6edf3">actedOnBehalfOf</tspan> — W3C PROV   ·   KERI: first-seen-wins, fork = <tspan fill="#fb7185">duplicity</tspan></text>
  </g>

  <!-- one-way reference -->
  <path d="M150 208 L150 322" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#b3)"/>
  <text x="162" y="270" font-size="11.5" fill="#58a6ff"><tspan font-family="ui-monospace,monospace">belief_state_ref</tspan> · content-hash</text>
  <text x="162" y="286" font-size="11.5" fill="#58a6ff">one-way ↓ — never ↑</text>

  <!-- CONTINUITY band -->
  <text x="40" y="300" font-size="11" font-weight="600" fill="#62d196" letter-spacing="0.1em">CONTINUITY — who is kin to whom · fork-FRIENDLY (Parfit)</text>
  <rect x="40" y="310" width="920" height="120" rx="8" fill="#0f1714" stroke="#1f3a2c" stroke-width="1"/>

  <g transform="translate(70,348)"><rect width="50" height="40" rx="6" fill="#161b22" stroke="#30363d"/><text x="25" y="25" font-size="11" fill="#8b949e" text-anchor="middle">…</text></g>
  <g transform="translate(170,348)"><rect width="60" height="40" rx="6" fill="#16241c" stroke="#62d196" stroke-width="1.3"/><text x="30" y="25" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">A</text></g>
  <g transform="translate(300,322)"><rect width="60" height="40" rx="6" fill="#16241c" stroke="#62d196" stroke-width="1.3"/><text x="30" y="25" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">A1</text></g>
  <g transform="translate(300,378)"><rect width="60" height="40" rx="6" fill="#16241c" stroke="#62d196" stroke-width="1.3"/><text x="30" y="25" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">A2</text></g>

  <path d="M120 368 L170 368" stroke="#6e7681" stroke-width="1.2" marker-end="url(#g3)"/>
  <path d="M230 362 Q 270 346 300 342" stroke="#62d196" stroke-width="1.3" fill="none" marker-end="url(#g3)"/>
  <path d="M230 374 Q 270 392 300 398" stroke="#62d196" stroke-width="1.3" fill="none" marker-end="url(#g3)"/>

  <text x="420" y="362" font-size="12.5" fill="#c9d1d9">fission is fine here —</text>
  <text x="420" y="382" font-size="12.5" fill="#c9d1d9">two descendants is just two descendants.</text>

  <rect x="40" y="448" width="920" height="36" rx="6" fill="#0f1419" stroke="#1f262e" stroke-width="0.8"/>
  <text x="58" y="471" font-size="12" fill="#e6edf3"><tspan fill="#fb7185" font-weight="600">Sybil</tspan> — "two leaves both acting as A" — is an <tspan font-weight="600">authority</tspan>-layer question (does the branch speak-for A?), never a continuity failure.</text>
</svg>
