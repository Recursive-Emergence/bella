  <path d="M883 248 Q 623 388 363 248" stroke="#62d196" stroke-width="1"   fill="none" opacity="0.18"/>

  <text x="300" y="372" font-size="12" fill="#62d196">connectedness = current-state overlap · a degree · non-transitive · fades with distance</text>

  <rect x="40" y="392" width="920" height="34" rx="6" fill="#0f1419" stroke="#1f262e" stroke-width="0.8"/>
  <text x="58" y="414" font-size="12.5" font-family="ui-monospace,monospace" fill="#c9d1d9">
    r_connect(bᵢ, bⱼ) = |shared prefix| / |union of the two chains|        kin?  ⇔  a common ancestor exists.
  </text>
