  <rect width="1000" height="440" fill="#0d1117"/>

  <text x="40" y="40" font-size="21" font-weight="600" fill="#e6edf3" letter-spacing="-0.01em">
    Relation R, split — connectedness vs. continuity
  </text>
  <text x="40" y="62" font-size="13" fill="#8b949e">
    Parfit's two components map to two operations on the same hash chain. The puzzle is fusing them.
  </text>

  <!-- continuity arc (above) -->
  <path d="M883 188 Q 493 96 103 188" stroke="#62d196" stroke-width="1.6" fill="none"/>
  <text x="493" y="118" font-size="12.5" fill="#62d196" text-anchor="middle">
    continuity = common ancestor reachable · transitive · yes/no  →  b₀ is reachable from b₆  ✓
  </text>

