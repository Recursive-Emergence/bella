  <text x="103" y="278" font-size="10" font-family="ui-monospace,monospace" fill="#8b949e" text-anchor="middle">founding</text>
  <text x="883" y="170" font-size="10" fill="#62d196" text-anchor="middle">advances every thought</text>

  <!-- connectedness arcs (below), fading with distance from leaf -->
  <path d="M883 248 Q 818 300 753 248" stroke="#62d196" stroke-width="3"   fill="none" opacity="1.0"/>
  <path d="M883 248 Q 753 330 623 248" stroke="#62d196" stroke-width="2.2" fill="none" opacity="0.6"/>
